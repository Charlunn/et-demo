[project]
name = "spark-pricing"
version = "0.1.0"
description = "电力现货交易 Demo: 报价→出清→结算→回测 端到端可交付模块 + Streamlit 产品工作台 (非 API 调试器)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "spark-pricing" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pulp>=2.8.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "click>=8.1.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-jose",
]

[project.scripts]
spark-pricing = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "seeded: tests using reproducible synthetic data (fixed seed)",
]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pulp",
    "ignore:Constructing LpVariable",
]

[tool.coverage.run]
source = ["app/services", "app/domain"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20", "RET"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "T20"]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
# Strict mypy runs on the value layers (core/domain/services); glue code (routes, models)
# is checked but more leniently where SQLAlchemy/Pydantic dynamic attrs appear.
files = ["app/core", "app/domain", "app/services"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pulp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true