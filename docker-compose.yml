# spark-pricing · docker-compose (SPEC §10: backend + db + frontend 三服务本地必跑).
# `docker compose up --build` 后:
#   前端 http://localhost:8501   后端 http://localhost:8000   (healthz/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - spark_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUG: "false"
      SECRET_KEY: "local-docker-compose-secret-key-change-me-please-64chars-min-aaaaaa"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      DATABASE_URL: "postgresql+asyncpg://spark:spark@db:5432/spark"
      CORS_ORIGINS: '["http://localhost:8501"]'
      DEMO_USER: "trader"
      DEMO_PASSWORD: "trader-secret"
      DEMO_SCOPES: "backtest:run"
      DEFAULT_FORECASTER: "persistence"
      LINE_FLOW_LIMIT_MW: "80.0"
      RESERVE_REQUIREMENT_MW: "20.0"
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: "http://backend:8000"
    ports:
      - "8501:8501"

volumes:
  spark_pgdata: